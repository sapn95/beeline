name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Generate icons (verify generator is reproducible)
        run: |
          npm run icons
          # porcelain, not `diff --exit-code`: this also catches a NEW icon file.
          if [ -n "$(git status --porcelain -- src/icons)" ]; then
            git status --porcelain -- src/icons
            echo "::error::The icon generator is not reproducible — commit the regenerated icons."
            exit 1
          fi

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build & package (Chrome + Firefox)
        run: npm run package

      - name: Lint Firefox build (web-ext)
        run: npx --yes web-ext@10 lint --source-dir=dist-firefox --warnings-as-errors=false

      - name: Upload extension builds
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: myapps-launcher*.zip
          if-no-files-found: error

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
