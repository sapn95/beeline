name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatchable so the release workflow can run the required checks on its
  # own PR branch: a pull request opened with the GITHUB_TOKEN does not
  # trigger `pull_request` runs, and workflow_dispatch is the documented
  # exception to that rule.
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

# A force-rebase should not leave a redundant 15-minute analysis running.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
