name: Store credentials check

# Publishing credentials rot silently: Google expires a Chrome Web Store refresh
# token after ~7 days while the OAuth consent screen is still in "Testing", and
# an AMO API key can be revoked. Left unnoticed, that is only discovered when a
# release is already half-done (tag pushed, GitHub release created, one store
# published). So check them every day and open an issue the moment one breaks.

on:
  schedule:
    - cron: '30 5 * * *' # daily, well before the monthly release at 06:00 on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the publishing credentials
        id: check
        continue-on-error: true # the issue below is the point, not a red run
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # pipefail, or `tee`'s exit status would hide the script's — the runner's
        # default shell is `bash -e {0}`, without it.
        run: |
          set -o pipefail
          node scripts/check-store-credentials.mjs | tee "$RUNNER_TEMP/result.txt"

      - name: Open or close the reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED: ${{ steps.check.outcome }}
          TITLE: 'Store publishing credentials need renewing'
        run: |
          set -euo pipefail
          # One issue at a time: find it by exact title rather than juggling labels.
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"

          if [ "$FAILED" != 'failure' ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment 'Credentials are accepted again — closing automatically.'
            fi
            echo "Credentials OK."
            exit 0
          fi

          body="$(
            printf '%s\n' \
              'The daily check could not use the publishing credentials:' \
              '' '```' "$(cat "$RUNNER_TEMP/result.txt")" '```' '' \
              '**Chrome (`invalid_grant`)** — the refresh token expired or was revoked. Mint a new one:' \
              '' '```bash' \
              'node scripts/get-cws-token.mjs <CLIENT_ID> <CLIENT_SECRET>   # BROWSER="Google Chrome"' \
              'gh secret set CHROME_REFRESH_TOKEN --body "<the new token>"' \
              '```' '' \
              'To stop this recurring, publish the OAuth consent screen from **Testing** to' \
              '**In production** in Google Cloud — tokens issued in testing mode die after ~7 days.' \
              '' '**Firefox** — regenerate the key pair at <https://addons.mozilla.org/developers/addon/api/key/>' \
              'and update `AMO_JWT_ISSUER` / `AMO_JWT_SECRET`.' \
              '' 'Then re-publish the version that missed its store: Actions -> Release -> Run workflow,' \
              'with the `tag` input set to the affected tag. This issue closes itself once the' \
              'credentials work again.'
          )"

          if [ -n "$existing" ]; then
            echo "::notice::Issue #$existing is already open."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
